server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This line intercepts requests and fallbacks to index.html if the file/folder doesn't exist
        try_files $uri $uri/ /index.html; 
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
